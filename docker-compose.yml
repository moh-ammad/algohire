services:
  postgres:
    image: postgres:18
    container_name: certiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: algohire
    ports:
      - "5432:5432"
    volumes:
      - certiflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algohire"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12
    container_name: certiflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  certiflow_pg:
